<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Home Tour video</title>
<link rel="stylesheet" href="../sfd.css">
<style>
html,body{overflow:hidden}
.v{position:relative;padding:20px 20px 22px}
.v video{display:block;width:100%;aspect-ratio:16/9;background:#000;border:2px solid var(--line)}
.v .row{margin-bottom:12px;justify-content:space-between}
.v h2{font-size:clamp(22px,3vw,30px)}
</style>
</head>
<body>
<div class="v">
<div class="bar" aria-hidden="true"></div>
<div class="row">
<div><p class="eyebrow">Prefer to watch?</p><h2>The tour in one minute</h2></div>
</div>
<video controls preload="metadata" playsinline poster="poster.jpg">
<source src="SFD-Club-Home-Tour.mp4" type="video/mp4">
</video>
</div>
</body>
</html>
