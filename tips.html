<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New to this? Tips</title>
<style>
@font-face{font-family:"Power Grotesk";src:url("fonts/PowerGrotesk-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Gilmer";src:url("fonts/gilmer-medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Gilmer";src:url("fonts/gilmer-bold.woff2") format("woff2");font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Gilmer,Arial,sans-serif;font-weight:500}
.panel{height:100%;padding:24px clamp(16px,4vw,32px);display:flex}
.closed{background:#111850;color:#fcf6f5;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
.open{background:#ccf3fa;color:#080609;flex-direction:column;gap:10px;overflow:auto}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.closed .eyebrow{color:#70e2f7}
h1{margin:6px 0 0;font-family:"Power Grotesk",Gilmer,sans-serif;font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.05}
.sub{margin:8px 0 0;font-size:16px;line-height:1.5;color:rgba(252,246,245,.72)}
.text{flex:1 1 300px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
button{min-height:48px;padding:0 26px;border:0;border-radius:999px;font-family:inherit;font-weight:700;font-size:17px;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:3px solid #da328a;outline-offset:2px}
.show{background:#70e2f7;color:#080609}
.hide{min-height:44px;padding:0 20px;font-size:15px;background:#080609;color:#fcf6f5}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<section class="panel closed" id="closed" aria-labelledby="t">
<div class="text">
<p class="eyebrow">New to this?</p>
<h1 id="t">Tips for this step</h1>
<p class="sub" id="sub" hidden></p>
</div>
<button type="button" class="show" id="show" aria-expanded="false" aria-controls="open">Show tips</button>
</section>
<section class="panel open" id="open" hidden aria-label="Tips">
<div class="row">
<p class="eyebrow" id="openLabel">New to this?</p>
<button type="button" class="hide" id="hide" aria-expanded="true" aria-controls="open">Hide tips</button>
</div>
<ul id="list"></ul>
</section>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var m = q.get('m') || 'A', l = q.get('l') || '1', s = q.get('s') || 'plan';
  var closed = document.getElementById('closed'), open = document.getElementById('open');
  function setOpen(v) {
    closed.hidden = v; open.hidden = !v;
    (v ? document.getElementById('hide') : document.getElementById('show')).focus();
  }
  document.getElementById('show').addEventListener('click', function () { setOpen(true); });
  document.getElementById('hide').addEventListener('click', function () { setOpen(false); });
  fetch('tips.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
    var e = d && d[m] && d[m][l] && d[m][l][s];
    if (!e) { document.getElementById('t').textContent = 'Tips coming soon'; document.getElementById('show').hidden = true; return; }
    document.getElementById('t').textContent = e.title;
    if (e.sub) { var sub = document.getElementById('sub'); sub.textContent = e.sub; sub.hidden = false; }
    document.getElementById('openLabel').textContent = 'New to this? ' + e.tips.length + ' tips';
    var ul = document.getElementById('list');
    e.tips.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  }).catch(function () { document.getElementById('t').textContent = 'Tips coming soon'; document.getElementById('show').hidden = true; });
})();
</script>
</body>
</html>
