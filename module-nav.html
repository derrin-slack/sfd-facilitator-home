<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facilitator quick links</title>
<link rel="stylesheet" href="sfd.css">
<style>
body{background:var(--black)}
.wrap{padding-top:18px;padding-bottom:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.top h1{font-size:clamp(22px,3vw,28px);line-height:1.1}
.links{display:flex;flex-wrap:wrap;gap:10px}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:1.45fr repeat(4,minmax(0,1fr));gap:8px}
.steps>li{background:var(--card);border:2px solid var(--line);border-top:6px solid var(--c);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hd{display:flex;align-items:baseline;gap:8px}
.hd b{font:700 22px/1 var(--head);color:var(--c)}
.hd strong{font-size:16px;line-height:1.15}
.when{align-self:flex-start;background:var(--c);color:var(--black);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px}
.go{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.go a{display:flex;align-items:center;gap:8px;min-height:34px;padding:5px 8px;border:2px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:13px;line-height:1.15}
.go a:hover{border-color:var(--c);background:var(--c);color:var(--black)}
.go a:hover .tag{background:var(--black);color:var(--c)}
.go a:hover svg{stroke:var(--black)}
.go a span.t{flex:1 1 auto;min-width:0}
.go svg{flex:0 0 14px;stroke:var(--muted)}
.tag{flex:0 0 auto;min-width:26px;height:22px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;background:var(--c);color:var(--black);font:700 12px var(--body)}
.go small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.go a:hover small{color:var(--black)}
@media (max-width:980px){.steps{grid-template-columns:1.3fr repeat(2,minmax(0,1fr))}.steps>li:first-child{grid-row:span 2}.wrap{padding-top:12px;padding-bottom:12px}.steps{margin-top:12px}.top{flex-wrap:nowrap;align-items:center}.top h1{font-size:21px}.links{flex-wrap:nowrap;gap:6px}.links .btn{min-height:36px;padding:0 12px;font-size:13px;white-space:nowrap}.top .eyebrow{letter-spacing:.08em;font-size:11px;white-space:nowrap}.go a{min-height:30px;padding:4px 8px}.go{gap:5px}.steps>li{padding:10px;gap:6px}}
@media (max-width:600px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.steps>li:first-child{grid-column:1/-1;grid-row:auto}}
@media (max-width:420px){.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar" aria-hidden="true"></div>
<main class="wrap">
<div class="top">
<div>
<p class="eyebrow" id="eyebrow">Facilitator Home</p>
<h1>Run the Pathway, every module</h1>
</div>
<nav class="links" aria-label="Facilitator quick links">
<a class="btn" href="https://sfdclubs.disco.co/page-app/UHJvZHVjdEFwcDozODI2MTc=" target="_top">Launch Steps</a>
<a class="btn ghost" href="https://sfdclubs.disco.co/page-app/UHJvZHVjdEFwcDozODI2MTk=" target="_top">Printables</a>
<a class="btn ghost" href="https://sfdclubs.disco.co/page-app/UHJvZHVjdEFwcDozODI2MjM=" target="_top">Live Help</a>
</nav>
</div>
<ol class="steps" id="steps"></ol>
</main>
<script>
// One file serves every module. Add ?m=B (and so on) to the embed link,
// then fill in that module's three guides below.
var D = function (id) { return 'https://drive.google.com/file/d/' + id + '/view'; };
var DL = function (id) { return 'https://drive.google.com/uc?export=download&id=' + id; };
var MODULES = {
  A: { name: 'Module A: Afrobeats & AI',
       qsg: 'https://cdn.disco.co/media/SFD_Module_A_Track_1_Quick_Start_Guide_eff62196-9df3-41f6-902b-76230636b3e0.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_A_Full_Facilitator_Guide_398a0645-5839-40a3-95d0-6da4f6d1fadc.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_A_Facilitator_Pages__All_Lessons__b56b75fb-75a8-477c-8acf-a88199e0f1d3.pdf',
       workbook: DL('169Nk2fygpzj3XX3R2rxqj7bV8SGDbhsm') },
  B: { name: 'Module B: Reggaeton, Algorithms & Virality',
       qsg: 'https://cdn.disco.co/media/SFD_Module_B_Track_1_Quick_Start_Guide_9a4d16f5-2f69-49b3-bc63-5274d0943c48.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_B_Full_Facilitator_Guide_b2290794-df62-4590-b285-446d468b97ad.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_B_Facilitator_Pages__All_Lessons__0b90d268-1afb-48b4-8fe3-c96bf3d4f69d.pdf',
       workbook: 'https://cdn.disco.co/media/SFD_Module_B_Student_Workbook_b152e355-ad11-4591-94d7-a9dffd2c11fe.pdf' },
  C: { name: 'Module C: Rhythm, Rotation & Radical Moves',
       qsg: 'https://cdn.disco.co/media/SFD_Module_C_Track_1_Quick_Start_Guide_1f302e41-2315-4266-99b4-6d1a52bdef4c.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_C_Full_Facilitator_Guide_ed583046-4d42-4d2b-97ad-ded33f659909.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_C_Facilitator_Pages__All_Lessons__f957a164-e6c8-490b-ae85-3ae953c8fd25.pdf',
       workbook: 'https://cdn.disco.co/media/SFD_Module_C_Student_Workbook_b6f94ae2-6da7-483c-9c95-2813276622d1.pdf' },
  D: { name: 'Module D: Break Dance Machine',
       qsg: 'https://cdn.disco.co/media/SFD_Module_D_Track_1_Quick_Start_Guide_8cdcd8ba-2bf7-4884-a0aa-80b51bea7a17.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_D_Full_Facilitator_Guide_d313de08-190c-4a20-9d19-af600b01f9d4.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_D_Facilitator_Pages__All_Lessons__09b98e7d-5197-40de-9dc5-c06b7e1d08ce.pdf',
       workbook: 'https://cdn.disco.co/media/SFD_Module_D_Student_Workbook_056c1f97-63d0-4f9e-8a8b-cfe2a08edcb8.pdf' },
  E: { name: 'Module E: Carbon Footstep',
       qsg: 'https://cdn.disco.co/media/SFD_Module_E_Track_1_Quick_Start_Guide_604d4042-c835-44ab-8db5-0858450bada9.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_E_Full_Facilitator_Guide_f6ac065d-4d20-49cb-84f2-2974b36b90bf.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_E_Facilitator_Pages__All_Lessons__706c8f53-a49c-435c-9171-828fd3f18886.pdf',
       workbook: 'https://cdn.disco.co/media/SFD_Module_E_Student_Workbook_2ab4de3a-2753-4516-935f-bb95f5ac4806.pdf' },
  F: { name: 'Module F: No Breath, No Justice',
       qsg: 'https://cdn.disco.co/media/SFD_Module_F_Track_1_Quick_Start_Guide_902d4c7b-a0cc-43ad-bfa6-01aa01b0091a.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_F_Full_Facilitator_Guide_899619f6-d21b-479d-8617-ac6947251b78.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_F_Facilitator_Pages__All_Lessons__df7f32f7-45a1-4b06-8ab3-92459a580f41.pdf',
       workbook: 'https://cdn.disco.co/media/SFD_Module_F_Student_Workbook_3df6e3d6-5810-4528-ab96-30be8cff18d1.pdf' },
  G: { name: 'Module G: Speakerboxx',
       qsg: 'https://cdn.disco.co/media/SFD_Module_G_Track_1_Quick_Start_Guide_ba756505-2a9c-4c37-affe-299ccb0f19fc.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_G_Full_Facilitator_Guide_2814789e-8dee-43dc-83f8-e49e96ed1410.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_G_Facilitator_Pages__All_Lessons__2437bee7-44b9-4747-b2fa-4cde7c6153a4.pdf',
       workbook: 'https://cdn.disco.co/media/SFD_Module_G_Student_Workbook_cd3d078b-a935-4d22-924a-dbc8dd143237.pdf' },
  H: { name: 'Module H: Dance Shoe Design',
       qsg: 'https://cdn.disco.co/media/SFD_Module_H_Track_1_Quick_Start_Guide_13164a2e-4663-4e0a-a8c3-306648f448d6.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_H_Full_Facilitator_Guide_de02d7fb-bb36-4e20-bc82-a23f4acffd75.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_H_Facilitator_Pages__All_Lessons__5e5bb8bb-ecb2-41d2-b301-b71d7069c05e.pdf',
       workbook: 'https://cdn.disco.co/media/SFD_Module_H_Student_Workbook_3e236bad-0fd7-4778-abde-02d4b52799b8.pdf' },
  I: { name: 'Module I: ChoreoGPT',
       qsg: 'https://cdn.disco.co/media/SFD_Module_I_Track_1_Quick_Start_Guide_ba950562-00a0-451d-b76d-82d590bc7dd8.pdf',
       guide: 'https://cdn.disco.co/media/SFD_Module_I_Full_Facilitator_Guide_478bc28e-25ea-4de6-bdfd-739f09a79e4d.pdf',
       pages: 'https://cdn.disco.co/media/SFD_Module_I_Facilitator_Pages__All_Lessons__0b96a161-b1c9-4ba5-96c1-5fc9294ea2e1.pdf',
       workbook: 'https://cdn.disco.co/media/SFD_Module_I_Student_Workbook_09d1046e-0910-47ad-bbe3-e9fe5c55ff2f.pdf' }
};
var LINKS = {
  printables: 'https://sfdclubs.disco.co/page-app/UHJvZHVjdEFwcDozODI2MTk=',
  milestones: D('1tFT7N9o0RVCOWF3tgpRBuL0U7pMOs94P'),
  passport: D('1e8gAQhYP3gwQEkYWApJToESQQOd3_7mz'),
  stickers: D('1l4ZCwmXeulSACpHR_WvidrHsTJeTxJKj'),
  tracker: 'https://docs.google.com/spreadsheets/d/1wbdRNiXUiJjmzWQQBfeAx1ZXFonrgFxC4Ens494OV-4/copy',
  paperTracker: D('1hbrnJCqvVgVshUy6cUM8lpIN5y_QD2ya'),
  survey: 'https://stemfromdance.jotform.com/260905277241860',
  facSurvey: 'https://stemfromdance.jotform.com/260894470706868',
  certificate: 'https://docs.google.com/document/d/1Tz7e69TitPfGaO0ugsnaAhgH4IzqoxHdOjejykQ_syY/copy'
};
var key = (new URLSearchParams(location.search).get('m') || 'A').toUpperCase();
var M = MODULES[key] || {};
if (M.name) { document.getElementById('eyebrow').textContent = 'Facilitator Home · ' + M.name; }

// tag: short label in the colored box. dl: a file download. top: opens in the Disco window.
var STEPS = [
  { c: 'var(--orange)', title: 'Set up', when: 'Before Module 1', go: [
    { tag: '1', t: 'Quick Start Guide', s: 'Track 1: STEM teachers', href: M.qsg, dl: true },
    { tag: '2', t: 'Facilitator Pages', s: 'Track 2 starts here', href: M.pages, dl: true },
    { tag: '3', t: 'Full Facilitator Guide', s: 'Optional background', href: M.guide, dl: true },
    { tag: 'Girls', t: 'Student Workbook', s: 'Optional', href: M.workbook, dl: true },
    { t: 'Printables', href: LINKS.printables, top: true } ] },
  { c: 'var(--pink)', title: 'Watch & listen', when: 'Every session', go: [
    { t: 'Milestone Guide', href: LINKS.milestones } ] },
  { c: 'var(--lav)', title: 'Sticker', when: 'When she earns it', go: [
    { t: 'Pathway Passport', href: LINKS.passport },
    { t: 'Sticker sheets', href: LINKS.stickers } ] },
  { c: 'var(--cyan)', title: 'Check the box', when: 'Same day', go: [
    { t: 'Copy tracker', href: LINKS.tracker },
    { t: 'Paper tracker', href: LINKS.paperTracker } ] },
  { c: 'var(--orange)', title: 'Celebrate', when: 'End of module', go: [
    { t: 'Student survey', href: LINKS.survey },
    { t: 'Your survey', href: LINKS.facSurvey },
    { t: 'Certificate', href: LINKS.certificate } ] }
];
var ICON_DL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3" aria-hidden="true"><path d="M12 3v13M6 11l6 6 6-6M4 21h16"/></svg>';
var ICON_GO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var ol = document.getElementById('steps');
STEPS.forEach(function (s, i) {
  var li = document.createElement('li'); li.style.setProperty('--c', s.c);
  var hd = document.createElement('div'); hd.className = 'hd';
  var b = document.createElement('b'); b.textContent = i + 1;
  var st = document.createElement('strong'); st.textContent = s.title;
  hd.appendChild(b); hd.appendChild(st);
  var w = document.createElement('span'); w.className = 'when'; w.textContent = s.when;
  var ul = document.createElement('ul'); ul.className = 'go';
  s.go.forEach(function (g) {
    if (!g.href) { return; }
    var a = document.createElement('a'); a.href = g.href;
    if (g.top) { a.target = '_top'; } else { a.target = '_blank'; a.rel = 'noopener'; }
    if (g.tag) { var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = g.tag; a.appendChild(tg); }
    var t = document.createElement('span'); t.className = 't'; t.textContent = g.t;
    if (g.s) { var sm = document.createElement('small'); sm.textContent = g.s; t.appendChild(sm); }
    a.appendChild(t);
    a.insertAdjacentHTML('beforeend', g.dl ? ICON_DL : ICON_GO);
    if (g.dl) { a.setAttribute('aria-label', 'Download ' + g.t + (g.s ? ', ' + g.s : '')); }
    var item = document.createElement('li'); item.appendChild(a); ul.appendChild(item);
  });
  li.appendChild(hd); li.appendChild(w); li.appendChild(ul);
  ol.appendChild(li);
});
</script>
</body>
</html>
