<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a module runs</title>
<link rel="stylesheet" href="sfd.css">
<style>
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:22px 0 0}
.tab{min-height:72px;padding:10px 12px;border:2px solid var(--line);border-bottom:6px solid var(--c);background:var(--card);color:var(--text);text-align:left;cursor:pointer;font:700 15px var(--body);display:flex;align-items:center;gap:10px}
.tab b{font:700 26px/1 var(--head);color:var(--c)}
.tab[aria-selected="true"]{background:var(--c);color:var(--black);border-color:var(--c)}
.tab[aria-selected="true"] b{color:var(--black)}
.panel{margin-top:12px;background:var(--card);border:2px solid var(--line);border-left:10px solid var(--c);padding:24px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.panel h2{font-size:clamp(24px,3.4vw,32px)}
.when{align-self:flex-start;background:var(--c);color:var(--black);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px}
.panel p.txt{color:var(--soft);font-size:18px;line-height:1.45;max-width:62ch}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:14px}
@media (max-width:760px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="bar" aria-hidden="true"></div>
<main class="wrap">
<p class="eyebrow">How a module runs</p>
<h1>Your five steps</h1>
<p class="sub">Every module runs the same way. Click a step to see what to do.</p>
<div class="tabs" role="tablist" aria-label="Module steps" id="tabs"></div>
<section class="panel" role="tabpanel" id="panel" tabindex="0" aria-live="polite"></section>
<div class="nav">
<button class="btn ghost" type="button" id="back">Back</button>
<button class="btn" type="button" id="next">Next step</button>
</div>
</main>
<script>
var D = function (id) { return 'https://drive.google.com/file/d/' + id + '/view'; };
var LINKS = {
  printables: 'https://sfdclubs.disco.co/page-app/UHJvZHVjdEFwcDozODI2MTk=',
  tracker: 'https://docs.google.com/spreadsheets/d/1wbdRNiXUiJjmzWQQBfeAx1ZXFonrgFxC4Ens494OV-4/copy',
  modules: 'https://sfdclubs.disco.co/page-app/UHJvZHVjdEFwcDozODI2MTg=',
  paperTracker: D('1hbrnJCqvVgVshUy6cUM8lpIN5y_QD2ya'),
  passport: D('1e8gAQhYP3gwQEkYWApJToESQQOd3_7mz'),
  lanyards: D('1lqvnToNW92xC4gD-fChfWJCixYfgCF-P'),
  milestones: D('1tFT7N9o0RVCOWF3tgpRBuL0U7pMOs94P'),
  survey: 'https://stemfromdance.jotform.com/260905277241860',
  facSurvey: 'https://stemfromdance.jotform.com/260894470706868',
  live: 'https://sfdclubs.disco.co/page-app/UHJvZHVjdEFwcDozODI2MjM=',
  share: 'https://sfdclubs.disco.co/feed/RmVlZDo0NTE2MQ==/posts',
  certificate: 'https://docs.google.com/document/d/1Tz7e69TitPfGaO0ugsnaAhgH4IzqoxHdOjejykQ_syY/copy'
};
// top: true opens in the Disco window. Everything else opens in a new tab.
var STEPS = [
  { c: 'var(--orange)', short: 'Pick', when: 'Before you start', title: 'Pick your module',
    text: 'Choose the module that fits your girls’ ages. Open it from My Modules and start with Lesson 1.',
    ctas: [{ t: 'My Modules', href: LINKS.modules, top: true }, { t: 'Module Guide', href: 'files/sfd-choosing-your-first-module.pdf' }] },
  { c: 'var(--pink)', short: 'Prep', when: 'Before each session', title: 'Get ready',
    text: 'Read the lesson plan, gather your materials and print what you need. Most sessions take 90 minutes to 2 hours.',
    ctas: [{ t: 'Printables', href: LINKS.printables, top: true }] },
  { c: 'var(--lav)', short: 'Teach', when: 'Every session', title: 'Teach in four parts',
    text: 'Every lesson runs the same way: Warm up, Learn, Try it and Reflect. Follow the lesson plan step by step. You don’t need to be an expert.',
    ctas: [{ t: 'Session Guide', href: 'files/sfd-how-to-run-a-session.pdf' }] },
  { c: 'var(--cyan)', short: 'Get help', when: 'Anytime', title: 'Get help',
    text: 'Join Club Support Hours every other Thursday, 2:30 to 4:30 PM ET. Or post a question in Share & Learn anytime.',
    ctas: [{ t: 'Live Help', href: LINKS.live, top: true }, { t: 'Share & Learn', href: LINKS.share, top: true }] },
  { c: 'var(--orange)', short: 'Celebrate', when: 'End of module', title: 'Celebrate',
    text: 'Show off what your girls made. Share a photo in Share & Learn, then take your Post-Module Survey.',
    ctas: [{ t: 'Your Survey', href: LINKS.facSurvey }, { t: 'Share & Learn', href: LINKS.share, top: true }] }
];
var N = STEPS.length, cur = 0, tabs = document.getElementById('tabs'), panel = document.getElementById('panel');
STEPS.forEach(function (s, i) {
  var t = document.createElement('button');
  t.type = 'button'; t.className = 'tab'; t.id = 'tab' + i; t.setAttribute('role', 'tab');
  t.setAttribute('aria-controls', 'panel'); t.style.setProperty('--c', s.c);
  t.innerHTML = '<b>' + (i + 1) + '</b><span></span>'; t.querySelector('span').textContent = s.short;
  t.addEventListener('click', function () { show(i); });
  t.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { show((i + 1) % N); tabs.children[(i + 1) % N].focus(); }
    if (e.key === 'ArrowLeft') { show((i + N - 1) % N); tabs.children[(i + N - 1) % N].focus(); }
  });
  tabs.appendChild(t);
});
function show(i) {
  cur = i; var s = STEPS[i];
  [].forEach.call(tabs.children, function (t, j) { t.setAttribute('aria-selected', j === i ? 'true' : 'false'); t.tabIndex = j === i ? 0 : -1; });
  panel.style.setProperty('--c', s.c); panel.setAttribute('aria-labelledby', 'tab' + i);
  panel.innerHTML = '';
  var e = document.createElement('p'); e.className = 'eyebrow'; e.textContent = 'Step ' + (i + 1) + ' of ' + N;
  var h = document.createElement('h2'); h.textContent = s.title;
  var w = document.createElement('span'); w.className = 'when'; w.textContent = s.when;
  var p = document.createElement('p'); p.className = 'txt'; p.textContent = s.text;
  var row = document.createElement('div'); row.className = 'ctas';
  s.ctas.forEach(function (c, k) {
    var a = document.createElement('a'); a.className = k === 0 ? 'btn' : 'btn ghost'; a.textContent = c.t; a.href = c.href;
    if (c.top) { a.target = '_top'; } else { a.target = '_blank'; a.rel = 'noopener'; }
    row.appendChild(a);
  });
  panel.appendChild(e); panel.appendChild(h); panel.appendChild(w); panel.appendChild(p); panel.appendChild(row);
  document.getElementById('back').style.visibility = i === 0 ? 'hidden' : 'visible';
  document.getElementById('next').textContent = i === N - 1 ? 'Start over' : 'Next step';
}
document.getElementById('next').addEventListener('click', function () { show(cur === N - 1 ? 0 : cur + 1); });
document.getElementById('back').addEventListener('click', function () { if (cur > 0) show(cur - 1); });
show(0);
</script>
</body>
</html>
