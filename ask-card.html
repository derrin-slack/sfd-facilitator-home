<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask SFD</title>
<link rel="stylesheet" href="sfd.css">
<style>
html,body{overflow:hidden}
.a{position:relative;display:flex;align-items:center;gap:18px 24px;flex-wrap:wrap;padding:22px 24px 22px 30px;background:var(--card);border:2px solid var(--line)}
.a::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--pink)}
.t{flex:1 1 300px;min-width:0}
.t h2{font-size:clamp(22px,3vw,28px)}
.t p.s{color:var(--soft);font-size:16px;margin-top:6px;max-width:60ch}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
</style>
</head>
<body>
<div class="a">
<div class="t">
<p class="eyebrow">Still have questions?</p>
<h2>Ask SFD</h2>
<p class="s">Post your question in Ask SFD and a real person will answer. Or drop in to Club Support Hours, every other Thursday, 2:30 to 4:30 PM ET.</p>
</div>
<div class="btns">
<a class="btn pink" href="https://sfdclubs.disco.co/channel/Q2hhdENoYW5uZWw6OTU0NjE=" target="_top">Ask SFD</a>
<a class="btn ghost" href="https://sfdclubs.disco.co/page-app/UHJvZHVjdEFwcDozODI2MjM=" target="_top">Live Help</a>
</div>
</div>
</body>
</html>
