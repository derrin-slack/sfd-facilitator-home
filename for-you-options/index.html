<script type="text/plain" id="logic">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { more: false };
}
renderVals() {
const more = this.state.more;
return {
more: more,
moreLabel: more ? 'Hide the numbers' : 'See the numbers',
moreIcon: more ? '\u2212' : '+',
toggleMore: () => this.setState({ more: !more })
};
}
